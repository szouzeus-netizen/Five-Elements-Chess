<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五行阵｜1v1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#161616;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.app{max-width:1450px;margin:auto;padding:18px}h1{margin:0;font-size:25px}.sub{color:#666;font-size:13px;margin:3px 0 14px}.layout{display:grid;grid-template-columns:minmax(650px,1fr) 390px;gap:16px}.card{background:#fff;border:1px solid #d9d9d9;border-radius:15px;box-shadow:0 2px 12px #0000000b}.boardCard{padding:10px}.board{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden}.board img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}.board svg{position:absolute;inset:0;width:100%;height:100%}.hit{fill:transparent;stroke:transparent;cursor:pointer}.hit:hover{fill:#0001}.smallText{font-size:31px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.bigText{font-size:52px;font-weight:900;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.smallDisc{stroke-width:4}.panel{padding:15px}.section{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid #eee}.section:last-child{border-bottom:0}.title{font-weight:800;margin-bottom:8px}.row{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;border:1px solid #cfcfcf;background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer}button:hover{background:#f2f2f2}button.active{outline:2px solid #111}button:disabled{opacity:.4;cursor:not-allowed}.el{min-width:48px;font-weight:700}.water{color:#0874d1}.fire{color:#d12c24}.metal{color:#111}.wood{color:#15983b}.earth{color:#a48600}.selected{background:#111;color:#fff}.status{padding:10px;background:#fafafa;border:1px solid #e4e4e4;border-radius:10px;font-size:13px;line-height:1.65}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{border:1px solid #e5e5e5;border-radius:9px;padding:9px;font-size:12px;line-height:1.7}.mini b{display:block;font-size:13px;margin-bottom:3px}.log{max-height:260px;overflow:auto;font-size:12px;line-height:1.5}.log div{padding:5px 0;border-bottom:1px solid #eee}.danger{border-color:#bbb}.room{font-family:ui-monospace,monospace;font-size:12px}.legend{font-size:12px;color:#666;line-height:1.5}.error{color:#b42318;background:#fff4f2;border:1px solid #f2c8c2;border-radius:8px;padding:8px;font-size:12px}.win{font-weight:800;font-size:16px;padding:10px;border-radius:9px;background:#f5f5f5}.bigAvail{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;font-size:12px}.bigAvail div{border:1px solid #ddd;border-radius:7px;padding:5px;text-align:center}.foot{font-size:11px;color:#777;margin-top:8px}@media(max-width:1050px){.layout{grid-template-columns:1fr}} 
</style></head><body><div class="app">
<h1>五行阵</h1><div class="sub">真实三角棋盘 · 1v1 房间同步 · 黑方（克）先行 · 默认金起点</div>
<div class="layout"><section class="card boardCard"><div class="board"><img src="/board.png" alt="五行阵棋盘"><svg id="svg" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet"></svg></div></section>
<aside class="card panel">
<div class="section"><div class="title">房间 / 执棋方</div><div class="row"><button id="blackSide">我是黑方</button><button id="whiteSide">我是白方</button></div><div class="row" style="margin-top:8px"><input id="room" class="room" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:8px" placeholder="房间名"><button id="join">进入</button></div><div id="turn" class="status" style="margin-top:8px">连接中…</div></div>
<div class="section"><div class="title">选择落子</div><div class="row" id="elements"></div><div class="row" style="margin-top:8px"><button id="smallBtn" class="active">小棋</button><button id="bigBtn">大棋</button><button id="handBigBtn">手牌大棋</button></div><div id="selection" class="legend" style="margin-top:8px">小棋点击小三角形；大棋点击完整的大三角形。大棋能力在确定时选择，可选择不发动。</div><button id="confirm" style="width:100%;margin-top:9px;font-weight:800" disabled>确定落子</button><div id="msg" style="margin-top:8px"></div></div>
<div class="section"><div class="title">公开信息</div><div class="grid2"><div class="mini"><b>黑方手牌</b><span id="blackHand"></span><b style="margin-top:5px">大棋</b><span id="blackBigHand"></span><b style="margin-top:5px">下张</b><span id="blackNext"></span></div><div class="mini"><b>白方手牌</b><span id="whiteHand"></span><b style="margin-top:5px">大棋</b><span id="whiteBigHand"></span><b style="margin-top:5px">下张</b><span id="whiteNext"></span></div></div><div class="mini" style="margin-top:8px"><b>大棋供应</b><div id="bigSupply" class="bigAvail"></div><b style="margin-top:6px">小棋供应</b><div id="supply"></div></div></div>
<div class="section"><div class="title">操作</div><div class="row"><button id="undo">撤回上一手</button><button id="reset">重置棋局</button></div><div class="legend" style="margin-top:8px">撤回会恢复整个上一回合状态；同一房间内双方都会同步。</div></div>
<div class="section"><div class="title">最近行动</div><div id="log" class="log">暂无</div></div>
<div id="win"></div><div class="foot">房间通过 URL 的 ?room= 参数共享；例如把同一个地址发给另一位玩家即可。</div>
</aside></div></div>
<script>
const E=['water','fire','metal','wood','earth'],CN={water:'水',fire:'火',metal:'金',wood:'木',earth:'土'},BIG={water:'淼',fire:'焱',metal:'鑫',wood:'森',earth:'垚'};
const S=[[530.0,120.21,455.5,241.77,604.5,241.77],[455.5,241.77,381.0,364.16,530.0,364.16],[604.5,241.77,530.0,364.16,679.0,364.16],[455.5,241.77,604.5,241.77,530.0,364.16],[381.0,364.16,306.5,487.39,455.5,487.39],[530.0,364.16,455.5,487.39,604.5,487.39],[679.0,364.16,604.5,487.39,753.5,487.39],[381.0,364.16,530.0,364.16,455.5,487.39],[530.0,364.16,679.0,364.16,604.5,487.39],[306.5,487.39,232.0,610.62,381.0,610.62],[455.5,487.39,381.0,610.62,530.0,610.62],[604.5,487.39,530.0,610.62,679.0,610.62],[753.5,487.39,679.0,610.62,828.0,610.62],[306.5,487.39,455.5,487.39,381.0,610.62],[455.5,487.39,604.5,487.39,530.0,610.62],[604.5,487.39,753.5,487.39,679.0,610.62],[232.0,610.62,157.5,733.85,306.5,733.85],[381.0,610.62,306.5,733.85,455.5,733.85],[530.0,610.62,455.5,733.85,604.5,733.85],[679.0,610.62,604.5,733.85,753.5,733.85],[828.0,610.62,753.5,733.85,902.5,733.85],[232.0,610.62,381.0,610.62,306.5,733.85],[381.0,610.62,530.0,610.62,455.5,733.85],[530.0,610.62,679.0,610.62,604.5,733.85],[679.0,610.62,828.0,610.62,753.5,733.85]];
const BIG_LOCS=[[1,2,3,4],[2,5,6,8],[3,6,7,9],[5,10,11,14],[6,8,9,15],[6,11,12,15],[7,12,13,16],[10,17,18,22],[11,14,15,23],[11,18,19,23],[12,15,16,24],[12,19,20,24],[13,20,21,25]];
const BIG_POLYS=[[530.0,120.21,455.5,241.77,381.0,364.16,679.0,364.16,604.5,241.77],[455.5,241.77,381.0,364.16,306.5,487.39,604.5,487.39,530.0,364.16],[604.5,241.77,530.0,364.16,455.5,487.39,753.5,487.39,679.0,364.16],[381.0,364.16,232.0,610.62,530.0,610.62],[381.0,364.16,530.0,610.62,679.0,364.16],[530.0,364.16,381.0,610.62,679.0,610.62],[679.0,364.16,530.0,610.62,828.0,610.62],[306.5,487.39,157.5,733.85,455.5,733.85],[306.5,487.39,455.5,733.85,604.5,487.39],[455.5,487.39,306.5,733.85,604.5,733.85],[455.5,487.39,604.5,733.85,753.5,487.39],[604.5,487.39,455.5,733.85,753.5,733.85],[753.5,487.39,604.5,733.85,902.5,733.85]];
const cx=p=>(p[0]+p[2]+p[4])/3,cy=p=>(p[1]+p[3]+p[5])/3;const roomInput=document.getElementById('room');let room=new URLSearchParams(location.search).get('room')||'main',state=null,kind='small',element='metal',pending=null,poll=null;
roomInput.value=room;
function api(method='GET',body){return fetch('/api/room/'+encodeURIComponent(room),{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined}).then(r=>r.json())}
function setMsg(t,bad=false){const m=document.getElementById('msg');m.className=bad?'error':'';m.textContent=t||''}
function render(){if(!state)return;const svg=document.getElementById('svg');svg.innerHTML='';
 S.forEach((p,i)=>{const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');poly.setAttribute('points',`${p[0]},${p[1]} ${p[2]},${p[3]} ${p[4]},${p[5]}`);poly.classList.add('hit');if(kind==='small')poly.onclick=()=>{pending={type:'small',cell:i+1};render()};svg.appendChild(poly);});
 if(kind==='big'||kind==='handbig')BIG_POLYS.forEach((p,i)=>{const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');let pts=[];for(let j=0;j<p.length;j+=2)pts.push(`${p[j]},${p[j+1]}`);poly.setAttribute('points',pts.join(' '));poly.classList.add('hit');poly.onclick=()=>{pending={type:kind==='handbig'?'handbig':'big',loc:i+1};render()};svg.appendChild(poly);});
 const drawn=new Set();state.board.forEach((v,i)=>{if(!v)return;if(v.kind==='big'){if(drawn.has(v.bigId))return;drawn.add(v.bigId);const g=document.createElementNS('http://www.w3.org/2000/svg','g'),p=BIG_POLYS[v.bigLoc],q=document.createElementNS('http://www.w3.org/2000/svg','polygon');let pts=[];for(let j=0;j<p.length;j+=2)pts.push(`${p[j]},${p[j+1]}`);q.setAttribute('points',pts.join(' '));q.setAttribute('fill',v.side==='black'?'#111':'#fff');q.setAttribute('stroke',v.side==='black'?'#fff':'#111');q.setAttribute('stroke-width','5');q.setAttribute('fill-opacity','.9');g.appendChild(q);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',cx(p));t.setAttribute('y',cy(p));t.setAttribute('class','bigText');t.setAttribute('fill',v.side==='black'?'#fff':'#111');t.textContent=BIG[v.element];g.appendChild(t);svg.appendChild(g)}else{const p=S[i],g=document.createElementNS('http://www.w3.org/2000/svg','g'),c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',cx(p));c.setAttribute('cy',cy(p));c.setAttribute('r','34');c.setAttribute('fill',v.side==='black'?'#111':'#fff');c.setAttribute('stroke',v.side==='black'?'#fff':'#111');c.setAttribute('class','smallDisc');g.appendChild(c);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',cx(p));t.setAttribute('y',cy(p));t.setAttribute('class','smallText');t.setAttribute('fill',v.side==='black'?'#fff':'#111');t.textContent=CN[v.element];g.appendChild(t);svg.appendChild(g)}});
 updatePanels();updateControls();}
function handText(side){const h=state.hands[side].small;return E.map(e=>`${CN[e]}${h[e]}`).join('　')}
function bigHandText(side){const h=state.hands[side].big;return E.map(e=>h[e]?`${BIG[e]}${h[e]}`:'').filter(Boolean).join('　')||'无'}
function updatePanels(){document.getElementById('turn').innerHTML=state.winner?`<div class="win">${state.winner==='black'?'黑方':'白方'}获胜 · ${state.winReason}</div>`:`当前：<b>${state.turn==='black'?'黑方':'白方'}</b>　回合 ${state.move}<br>起点：${CN[state.start]}`;document.getElementById('blackHand').textContent=handText('black');document.getElementById('whiteHand').textContent=handText('white');document.getElementById('blackBigHand').textContent=bigHandText('black');document.getElementById('whiteBigHand').textContent=bigHandText('white');document.getElementById('blackNext').textContent=CN[state.next.black];document.getElementById('whiteNext').textContent=CN[state.next.white];document.getElementById('supply').textContent=E.map(e=>`${CN[e]} ${state.supply[e]}`).join('　');document.getElementById('bigSupply').innerHTML=E.map(e=>`<div>${BIG[e]}<br>${state.bigSupply[e]}</div>`).join('');document.getElementById('log').innerHTML=state.log.length?state.log.map(x=>`<div>${x}</div>`).join(''):'暂无';document.getElementById('win').innerHTML=state.winner?`<div class="win" style="margin-top:10px">本局结束：${state.winner==='black'?'黑方':'白方'} · ${state.winReason}</div>`:''}
function updateControls(){document.getElementById('smallBtn').classList.toggle('active',kind==='small');document.getElementById('bigBtn').classList.toggle('active',kind==='big');document.getElementById('handBigBtn').classList.toggle('active',kind==='handbig');document.querySelectorAll('#elements button').forEach(b=>b.classList.toggle('active',b.dataset.e===element));const ok=!!pending&&!state.winner&&state.turn===sideFromUrl();document.getElementById('confirm').disabled=!ok;document.getElementById('selection').textContent=pending?(pending.type==='small'?`已选小棋位置：${pending.cell}`:`已选大三角形：${pending.loc}`):'请点击棋盘内的三角形选择位置。'}
function sideFromUrl(){return new URLSearchParams(location.search).get('side')||'black'}
function setSide(s){history.replaceState({},'',`?room=${encodeURIComponent(room)}&side=${s}`);pending=null;render()}
document.getElementById('blackSide').onclick=()=>setSide('black');document.getElementById('whiteSide').onclick=()=>setSide('white');
function buildElements(){const d=document.getElementById('elements');d.innerHTML=E.map(e=>`<button class="el ${e}" data-e="${e}">${CN[e]}</button>`).join('');d.querySelectorAll('button').forEach(b=>b.onclick=()=>{element=b.dataset.e;pending=null;render()})}
buildElements();
document.getElementById('smallBtn').onclick=()=>{kind='small';pending=null;render()};document.getElementById('bigBtn').onclick=()=>{kind='big';pending=null;render()};document.getElementById('handBigBtn').onclick=()=>{kind='handbig';pending=null;render()};
function abilityFor(e){
 if(e==='water'){const x=prompt('淼：输入最多2组移动，格式 10>17,11>18；留空则不发动');if(!x)return{kind:'none'};return{kind:'water',moves:x.split(',').map(v=>{const [from,to]=v.split('>').map(Number);return{from,to}})};}
 if(e==='wood'){const x=prompt('森：输入最多2个放置，格式 水@10,火@11；留空则不发动');if(!x)return{kind:'none'};const em={'水':'water','火':'fire','金':'metal','木':'wood','土':'earth'};return{kind:'wood',places:x.split(',').map(v=>{const [a,b]=v.split('@');return{element:em[a.trim()]||a.trim(),cell:Number(b)}})};}
 if(e==='fire'){const x=prompt('焱：输入最多2个相邻小棋位置，例如 10,11；留空则不发动');if(!x)return{kind:'none'};return{kind:'fire',remove:x.split(',').map(Number)};}
 if(e==='earth'){const x=prompt('垚：输入最多2个相邻小棋位置翻转，例如 10,11；留空则不发动');if(!x)return{kind:'none'};return{kind:'earth',flip:x.split(',').map(Number)};}
 if(e==='metal'){const x=prompt('鑫：输入“元素@位置”，例如 水@10；留空则不发动');if(!x)return{kind:'none'};const [a,b]=x.split('@');const em={'水':'water','火':'fire','金':'metal','木':'wood','土':'earth'};return{kind:'metal',element:em[a.trim()]||a.trim(),cell:Number(b)};}
 return{kind:'none'};
}
document.getElementById('confirm').onclick=async()=>{if(!pending)return;let body;if(pending.type==='small'){body={action:'small',cell:pending.cell,element};}else if(pending.type==='handbig'){body={action:'bigHand',loc:pending.loc,element,ability:abilityFor(element)};}else{const raw=prompt('炼化素材：输入3个来源，用逗号分隔。手牌写 H，场上小棋写格号，例如 H,10,11。留空则自动选择任意3个。');let sources;if(raw&&raw.trim())sources=raw.split(',').map(x=>x.trim().toUpperCase()==='H'?'hand':Number(x.trim()));body={action:'big',loc:pending.loc,element,ability:abilityFor(element),sources};}const r=await api('POST',body);if(!r.ok){setMsg(r.reason||'落子失败',true);return}setMsg('');pending=null;state=r.state;render()};
document.getElementById('undo').onclick=async()=>{const r=await api('POST',{action:'undo'});if(!r.ok){setMsg(r.reason||'无法撤回',true);return}setMsg('');pending=null;state=r.state;render()};document.getElementById('reset').onclick=async()=>{if(!confirm('确定重置整局？'))return;const r=await api('POST',{action:'reset',start:'metal'});setMsg('');pending=null;state=r.state;render()};document.getElementById('join').onclick=()=>{room=roomInput.value.trim()||'main';history.replaceState({},'',`?room=${encodeURIComponent(room)}&side=${encodeURIComponent(sideFromUrl())}`);load()};
async function load(){state=await api();render()}load();poll=setInterval(load,1000);
</script></body></html>
